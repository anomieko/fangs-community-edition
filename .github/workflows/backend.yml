name: backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    # The server image's base (server/Dockerfile): tests run on production's python3 and python3-aiohttp.
    container: debian:trixie-slim
    steps:
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 python3-aiohttp ca-certificates git
      - uses: actions/checkout@v5
      - run: python3 -B -m unittest discover -s backend/tests -v

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: pipx run ruff==0.17.1 check backend
