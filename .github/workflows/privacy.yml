name: privacy

on:
  push:
  pull_request:

jobs:
  # Nothing private in the tracked files: real IP addresses, email addresses, private keys (tools/setup/leakcheck.py).
  leakcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: python3 -I tools/setup/leakcheck.py
